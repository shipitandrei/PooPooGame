name: Build Poo Poo PS4 PKG

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Poo Poo PS4 PKG
    runs-on: ubuntu-22.04

    env:
      OO_PS4_TOOLCHAIN: ${{ github.workspace }}/OpenOrbis/PS4Toolchain

    steps:
      - name: Checkout PooPooGame
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld make curl wget tar unzip ca-certificates

      - name: Install libssl1.1 for PkgTool.Core
        run: |
          wget -q \
            https://deb.debian.org/debian/pool/main/o/openssl/libssl1.1_1.1.1w-0+deb11u1_amd64.deb \
            -O /tmp/libssl1.1.deb

          sudo dpkg -i /tmp/libssl1.1.deb
          sudo ldconfig

          dpkg -s libssl1.1

      - name: Download OpenOrbis v0.5.4
        run: |
          wget -q \
            https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz \
            -O /tmp/toolchain-llvm-18.tar.gz

      - name: Extract OpenOrbis toolchain
        run: |
          mkdir -p "$GITHUB_WORKSPACE/OpenOrbis"

          tar -xzf /tmp/toolchain-llvm-18.tar.gz \
            -C "$GITHUB_WORKSPACE"

          test -f "$OO_PS4_TOOLCHAIN/link.x"
          test -f "$OO_PS4_TOOLCHAIN/bin/linux/PkgTool.Core"
          test -f "$OO_PS4_TOOLCHAIN/bin/linux/create-gp4"
          test -f "$OO_PS4_TOOLCHAIN/bin/linux/create-fself"

          chmod +x "$OO_PS4_TOOLCHAIN/bin/linux/"*

      - name: Verify OpenOrbis toolchain
        run: |
          echo "OO_PS4_TOOLCHAIN=$OO_PS4_TOOLCHAIN"

          test -d "$OO_PS4_TOOLCHAIN/include"
          test -d "$OO_PS4_TOOLCHAIN/lib"
          test -d "$OO_PS4_TOOLCHAIN/bin/linux"

          "$OO_PS4_TOOLCHAIN/bin/linux/PkgTool.Core" --help || true

      - name: Prepare Hello World sample layout
        run: |
          mkdir -p "$GITHUB_WORKSPACE/_common"

          cp -R "$OO_PS4_TOOLCHAIN/samples/_common/"* \
            "$GITHUB_WORKSPACE/_common/"

          cp Makefile hello_world/Makefile

          cp -R assets hello_world/
          cp -R sce_module hello_world/
          cp -R sce_sys hello_world/

      - name: Build PKG
        working-directory: hello_world
        run: |
          make clean || true
          make

      - name: Verify PKG
        run: |
          PKG="$(find "$GITHUB_WORKSPACE/hello_world" -maxdepth 1 -type f -name '*.pkg' -print -quit)"

          if [ -z "$PKG" ]; then
            echo "ERROR: No PKG was produced."
            exit 1
          fi

          echo "PKG successfully produced:"
          ls -lh "$PKG"

      - name: Upload PKG
        uses: actions/upload-artifact@v4
        with:
          name: PooPooGame-PS4-PKG
          path: hello_world/*.pkg
          if-no-files-found: error
