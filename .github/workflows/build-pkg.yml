name: Build Poo Poo PS4 PKG

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup OpenOrbis PS4 Toolchain
        uses: OpenOrbis/ps4-toolchain@v1

      - name: Build package
        run: make pkg

      - name: Upload PKG
        uses: actions/upload-artifact@v4
        with:
          name: poopoogame-pkg
          path: "**/*.pkg"
          if-no-files-found: error
