name: Build PS4 PKG

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  # Release tag from https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases
  OO_TOOLCHAIN_VERSION: v0.5.4
  # Avoids needing ICU for the .NET-based PkgTool.Core
  DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"

jobs:
  build:
    # OpenOrbis's own CI builds and packages samples on ubuntu-22.04
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-14 lld-14 llvm-14 jq unzip curl make
          # The Makefile calls unversioned clang / clang++ / ld.lld
          sudo ln -sf /usr/bin/clang-14   /usr/local/bin/clang
          sudo ln -sf /usr/bin/clang++-14 /usr/local/bin/clang++
          sudo ln -sf /usr/bin/ld.lld-14  /usr/local/bin/ld.lld

      - name: Download OpenOrbis toolchain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Look up the real asset name via the GitHub API instead of guessing it.
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/tags/${OO_TOOLCHAIN_VERSION}" \
            -o release.json

          echo "Assets in ${OO_TOOLCHAIN_VERSION}:"
          jq -r '.assets[].name' release.json

          # Prefer the LLVM 14 build if several exist, otherwise take the first toolchain archive.
          url=$(jq -r '[.assets[] | select(.name | test("toolchain.*\\.(tar\\.gz|zip)$"))]
                       | (map(select(.name | test("llvm-14"))) + .)
                       | .[0].browser_download_url // empty' release.json)
          if [ -z "$url" ]; then
            echo "::error::No toolchain archive found in release ${OO_TOOLCHAIN_VERSION}"
            exit 1
          fi
          echo "Using $url"

          mkdir -p /tmp/oo && cd /tmp/oo
          curl -fsSL "$url" -o asset
          case "$url" in
            *.zip)
              unzip -q asset
              inner=$(find . -name '*.tar.gz' | head -n1)
              if [ -n "$inner" ]; then tar -xzf "$inner"; fi
              ;;
            *)
              tar -xzf asset
              ;;
          esac

          link=$(find /tmp/oo -name link.x | head -n1)
          if [ -z "$link" ]; then echo "::error::link.x not found, unexpected archive layout"; find /tmp/oo -maxdepth 3; exit 1; fi
          root=$(dirname "$link")
          chmod -R +x "$root/bin/linux"
          echo "OO_PS4_TOOLCHAIN=$root" >> "$GITHUB_ENV"
          echo "$root/bin/linux" >> "$GITHUB_PATH"
          ls "$root" "$root/bin/linux"
          test -x "$root/bin/linux/PkgTool.Core"
          test -x "$root/bin/linux/create-gp4"
          test -x "$root/bin/linux/create-fself"

      - name: Check required project files
        run: |
          missing=0
          for f in Makefile hello_world sce_sys/icon0.png sce_sys/about/right.sprx sce_module; do
            if [ ! -e "$f" ]; then echo "::error::Missing $f"; missing=1; fi
          done
          ls -R sce_sys sce_module hello_world || true
          exit $missing

      - name: Build eboot.bin and PKG
        run: |
          # The Makefile derives its source dir from the checkout folder name, but
          # the sources live in ./hello_world, so pass PROJDIR explicitly.
          rm -f sce_sys/param.sfo pkg.gp4 eboot.bin ./*.pkg
          make PROJDIR=hello_world

      - name: Verify PKG
        run: |
          pkg=$(ls ./*.pkg | head -n1)
          ls -lh "$pkg" eboot.bin
          test -s "$pkg"
          # PS4 PKG magic is 0x7F 'C' 'N' 'T'
          test "$(head -c4 "$pkg" | od -An -tx1 | tr -d ' \n')" = "7f434e54"

      - name: Upload PKG
        uses: actions/upload-artifact@v4
        with:
          name: PooPooGame-pkg
          path: |
            *.pkg
            eboot.bin
          if-no-files-found: error
